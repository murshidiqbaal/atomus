# ============================================================

# Atomus ERP -- Codemagic CI/CD (Simulator-only iOS builds)

# ============================================================

# This configuration:

# - Builds Android APK + AAB normally

# - Builds ONLY iOS simulator apps (.app)

# - Does NOT require Apple signing

# - Does NOT require App Store publishing

# - Does NOT require provisioning profiles

# - Works without Mac/iPhone ownership

# ============================================================

definitions:
scripts:
- &decode_firebase_ios
name: Decode GoogleService-Info.plist
script: |
echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode 
> ios/Runner/GoogleService-Info.plist

```
- &decode_firebase_android
  name: Decode google-services.json
  script: |
    echo "$GOOGLE_SERVICES_JSON" | base64 --decode \
      > android/app/google-services.json

- &flutter_pub_get
  name: Flutter packages
  script: |
    flutter --version
    flutter packages pub get

- &pod_install
  name: CocoaPods install
  script: |
    find . -name "Podfile" -execdir pod install --repo-update \;

- &build_ios_simulator
  name: Build iOS Simulator App
  script: |
    flutter build ios --simulator

- &build_android
  name: Build Android AAB + APK
  script: |
    flutter build appbundle --release \
      --build-name=1.0.$BUILD_NUMBER \
      --build-number=$BUILD_NUMBER

    flutter build apk --release \
      --build-name=1.0.$BUILD_NUMBER \
      --build-number=$BUILD_NUMBER
```

flutter_env: &flutter_env
flutter: stable
xcode: latest
cocoapods: default
java: 17

workflows:

# ==========================================================

# Parent App

# ==========================================================

atomus-parent:
name: Atomus Parent (Simulator Build)

```
instance_type: mac_mini_m2

max_build_duration: 60

environment:
  <<: *flutter_env

  groups:
    - firebase_parent

  android_signing:
    - atomus_keystore

  vars:
    BUNDLE_ID: com.atomus.parentapp
    PACKAGE_NAME: com.atomus.parentapp

scripts:
  - *decode_firebase_ios
  - *decode_firebase_android
  - *flutter_pub_get
  - *pod_install
  - *build_ios_simulator
  - *build_android

artifacts:
  - build/ios/iphonesimulator/*.app
  - build/app/outputs/bundle/release/*.aab
  - build/app/outputs/flutter-apk/*.apk
```

# ==========================================================

# Teacher App

# ==========================================================

atomus-teacher:
name: Atomus Teacher (Simulator Build)

```
instance_type: mac_mini_m2

max_build_duration: 60

environment:
  <<: *flutter_env

  groups:
    - firebase_teacher

  android_signing:
    - atomus_keystore

  vars:
    BUNDLE_ID: com.atomus.teacherapp
    PACKAGE_NAME: com.atomus.teacherapp

scripts:
  - *decode_firebase_ios
  - *decode_firebase_android

  - name: Rebrand bundle id (teacher)
    script: |
      sed -i '' "s/com.atomus.parentapp/$BUNDLE_ID/g" \
        ios/Runner.xcodeproj/project.pbxproj \
        ios/Runner/GoogleService-Info.plist \
        android/app/build.gradle.kts \
        android/app/google-services.json

      mkdir -p android/app/src/main/kotlin/com/atomus/teacherapp

      mv android/app/src/main/kotlin/com/atomus/parentapp/MainActivity.kt \
         android/app/src/main/kotlin/com/atomus/teacherapp/MainActivity.kt

      sed -i '' "s/com.atomus.parentapp/$BUNDLE_ID/g" \
        android/app/src/main/kotlin/com/atomus/teacherapp/MainActivity.kt

      rm -rf android/app/src/main/kotlin/com/atomus/parentapp

  - *flutter_pub_get
  - *pod_install
  - *build_ios_simulator
  - *build_android

artifacts:
  - build/ios/iphonesimulator/*.app
  - build/app/outputs/bundle/release/*.aab
  - build/app/outputs/flutter-apk/*.apk
```

