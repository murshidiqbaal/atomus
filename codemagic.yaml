# ============================================================

# Atomus ERP - Codemagic Configuration

# FREE iOS Simulator Build Setup

# ============================================================

# This setup:

# ✅ Builds Android APK + AAB

# ✅ Builds iOS Simulator app (.app)

# ✅ Does NOT require Apple Developer account

# ✅ Does NOT require App Store upload

# ✅ Does NOT require provisioning profiles

# ✅ Works on Codemagic free plan

# ❌ Does NOT generate installable IPA

# ❌ Does NOT install on real iPhone

# ============================================================

workflows:

# ==========================================================

# PARENT APP

# ==========================================================

atomus-parent:
name: Atomus Parent Simulator Build


instance_type: mac_mini_m2

max_build_duration: 60

environment:
  flutter: stable
  xcode: latest
  cocoapods: default
  java: 17

  groups:
    - firebase_parent

  android_signing:
    - atomus_keystore

  vars:
    BUNDLE_ID: com.atomus.parentapp
    PACKAGE_NAME: com.atomus.parentapp

scripts:
  - name: Flutter Clean
    script: |
      flutter clean

  - name: Install Flutter Packages
    script: |
      flutter pub get

  - name: Decode Firebase Android Config
    script: |
      echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

  - name: Decode Firebase iOS Config
    script: |
      echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist

  - name: Install CocoaPods
    script: |
      cd ios
      pod install --repo-update
      cd ..

  - name: Build Android APK
    script: |
      flutter build apk --release \
        --build-name=1.0.$BUILD_NUMBER \
        --build-number=$BUILD_NUMBER

  - name: Build Android App Bundle
    script: |
      flutter build appbundle --release \
        --build-name=1.0.$BUILD_NUMBER \
        --build-number=$BUILD_NUMBER

  - name: Build iOS Simulator App
    script: |
      flutter build ios --simulator

artifacts:
  - build/app/outputs/flutter-apk/*.apk
  - build/app/outputs/bundle/release/*.aab
  - build/ios/iphonesimulator/*.app


